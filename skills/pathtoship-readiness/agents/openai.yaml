interface:
  display_name: "PathToShip readiness check"
  short_description: "Run a production-readiness check on the GitHub repository your builder syncs to, then fix and verify."
  icon_small: "./assets/icon.png"
  icon_large: "./assets/icon.png"
  brand_color: "#E3A94C"
  default_prompt: "Is my app ready to launch? Check https://github.com/me/my-app with PathToShip."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "pathtoship"
      description: "PathToShip production-readiness checks (start_scan, get_score, get_findings, get_finding_detail, verify_fix, get_scan_status, check_connection, prr_interview)"
      transport: "streamable_http"
      url: "https://pathtoship.com/api/mcp"
