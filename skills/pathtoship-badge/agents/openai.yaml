interface:
  display_name: "PathToShip readiness badge"
  short_description: "Add the live readiness badge to the README or site once a PathToShip check clears the ship bar."
  icon_small: "./assets/icon.png"
  icon_large: "./assets/icon.png"
  brand_color: "#E3A94C"
  default_prompt: "Add the PathToShip readiness badge to my README."

policy:
  allow_implicit_invocation: false

dependencies:
  tools:
    - type: "mcp"
      value: "pathtoship"
      description: "PathToShip production-readiness checks (start_scan, get_score, get_findings, get_finding_detail, verify_fix, get_scan_status, check_connection, prr_interview)"
      transport: "streamable_http"
      url: "https://pathtoship.com/api/mcp"
